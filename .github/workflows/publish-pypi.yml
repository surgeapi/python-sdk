name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published stable release tag (vMAJOR.MINOR.PATCH).
        required: true
        type: string
      confirmation:
        description: Type republish-reviewed-release for manual recovery.
        required: true
        type: string

concurrency:
  group: stlc-package-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Keep this exact production identity guard when back-syncing to staging.
    if: github.repository == 'surgeapi/python-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release verification code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve an existing published release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASES_ENABLED: ${{ vars.STLC_PACKAGE_RELEASE_ENABLED }}
        with:
          script: |
            await require('./.github/scripts/stlc-release.cjs').resolveRelease({
              github, context, core,
              expectedRepository: 'surgeapi/python-sdk',
              enabled: process.env.RELEASES_ENABLED
            });
      - name: Check out the exact released commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed main ancestry and package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          node .github/scripts/stlc-release.cjs python
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.10.2'
      - name: Publish the released package
        run: bash ./bin/publish-pypi
